<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心理健康自评</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--mint:#7DD3C0;--mint-light:#A8E6CF;--lavender:#B8A9C9;--lavender-light:#D4C5E8;--peach:#FFB5A7;--peach-light:#FFD3C9;--cream:#FDF8F5;--cream-dark:#F5EDE8;--sky:#A8D8EA;--sky-light:#C5E8F4;--text:#5A5A6E---text-light:#8B8B9E;--shadow:rgba(125,211,192,0.2)}
body{font-family:-apple-system,sans-serif;background:linear-gradient(135deg,var(--cream),var(--sky-light),var(--lavender-light));min-height:100vh;padding:20px}
.welcome-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,var(--mint-light),var(--sky-light),var(--lavender-light));z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px}
.welcome-overlay.hidden{display:none}
.welcome-content{background:white;border-radius:28px;padding:32px;max-width:400px;width:100%;box-shadow:0 20px 60px var(--shadow)}
.welcome-icon{font-size:3.5em;text-align:center;margin-bottom:12px}
.welcome-title{font-size:1.4em;font-weight:700;color:var(--text);text-align:center;margin-bottom:20px}
.welcome-subtitle{color:var(--text-light);text-align:center;font-size:0.9em;margin-bottom:24px}
.role-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}
.role-card{background:var(--cream);border-radius:16px;padding:20px 16px;text-align:center;cursor:pointer;transition:all 0.3s; border:2px solid transparent}
.role-card:hover{transform:translateY(-4px);box-shadow:0 8px 20px var(--shadow)}
.role-card.selected{border-color:var(--mint);background:linear-gradient(135deg,var(--mint-light),var(--sky-light))}
.role-icon{font-size:2.5em;margin-bottom:8px}
.role-name{font-size:0.95em;font-weight:600;color:var(--text);margin-bottom:4px}
.role-desc{font-size:0.75em;color:var(--text-light)}
.btn{width:100%;padding:16px 24px;border:none;border-radius:14px;font-size:1em;cursor:pointer;font-weight:600}
.btn-primary{background:linear-gradient(135deg,var(--mint),var(--sky));color:white;box-shadow:0 6px 20px var(--shadow)}
.btn-primary:disabled{background:#ccc;cursor:not-allowed}
</style>
</head>
<body>
<div class="welcome-overlay" id="welcomeOverlay">
<div class="welcome-content">
<div class="welcome-icon">🍿</div>
<h2 class="welcome-title">心理健康自评</h2>
<p class="welcome-subtitle">选择最符合你的角色，获得定制化的心理评估</p>
<div class="role-grid" id="roleGrid">
<div class="role-card" data-role="workplace"><div class="role-icon">💼</div><div class="role-name">职场女性</div><div class="role-desc">工作压力大</div></div>
<div class="role-card" data-role="homemaker"><div class="role-icon">🏠</div><div class="role-name">家庭主妇</div><div class="role-desc">家庭事务繁重</div></div>
<div class="role-card" data-role="student"><div class="role-icon">📚</div><div class="role-name">学生党</div><div class="role-desc">学业压力繁重</div></div>
<div class="role-card" data-role="freelancer"><div class="role-icon">⬟</div><div class="role-name">自由职业</div><div class="role-desc">生活不规律</div></div>
<div class="role-card" data-role="parent"><div class="role-icon">👶</div><div class="role-name">新手妈妼</div><div class="role-desc">肨儿压力与挑战</div></div>
<div class="role-card" data-role="career"><div class="role-icon">🚀</div><div class="role-name">创业者</div><div class="role-desc">事业生活平衍</div></div>
</div>
<button class="btn btn-primary" id="startBtn" disabled>开始评估</button>
</div>
</div>
<script>
document.addEventListener('DOMContentLoaded',function(){
var roleGrid=document.getElementById('roleGrid');
var startBtn=document.getElementById('startBtn');
var welcomeOverlay=document.getElementById('welcomeOverlay');
var selectedRole=localStorage.getItem('mhRole');
if(selectedRole){startBtn.disabled=false;var card=roleGrid.querySelector('[data-role="'+selectedRole+'"]');if(card)card.classList.add('selected');}
roleGrid.addEventListener('click',function(e){var card=e.target.closest('.role-card');if(!card)return;var cards=roleGrid.querySelectorAll('.role-card');for(var i=0;i<cards.length;i++)cards[i].classList.remove('selected');card.classList.add('selected');localStorage.setItem('mhRole',card.dataset.role);startBtn.disabled=false;});
startBtn.addEventListener('click',function(){welcomeOverlay.classList.add('hidden');alert('开始评估！角色：'+localStorage.getItem('mhRole'));});
});
</script>
</body>
</html>
