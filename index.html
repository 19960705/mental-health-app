<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心理健康自评</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --mint: #7DD3C0;
            --mint-light: #A8E6CF;
            --lavender: #B8A9C9;
            --lavender-light: #D4C5E8;
            --peach: #FFB5A7;
            --peach-light: #FFD3C9;
            --cream: #FDF8F5;
            --cream-dark: #F5EDE8;
            --sky: #A8D8EA;
            --sky-light: #C5E8F4;
            --text: #5A5A6E;
            --text-light: #8B8B9E;
            --shadow: rgba(125, 211, 192, 0.2);
        }
        
        body {
            font-family: -apple-system, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, var(--sky-light) 50%, var(--lavender-light) 100%);
            min-height: 100vh;
            padding: 20px;
            padding-top: 40px;
        }
        
        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 40px var(--shadow);
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
        }
        
        h1 {
            color: var(--text);
            font-size: 1.5em;
            text-align: center;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: var(--text-light);
            text-align: center;
            font-size: 0.9em;
            margin-bottom: 16px;
        }
        
        .privacy-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--mint-light);
            color: #2D6A4F;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-bottom: 20px;
        }
        
        .nav-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .nav-tab {
            flex: 1;
            min-width: 60px;
            padding: 10px 6px;
            border: none;
            border-radius: 10px;
            font-size: 0.72em;
            cursor: pointer;
            transition: all 0.3s;
            background: var(--cream-dark);
            color: var(--text-light);
            text-align: center;
        }
        
        .nav-tab.active {
            background: linear-gradient(135deg, var(--mint), var(--sky));
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 15px var(--shadow);
        }
        
        .nav-tab:hover:not(.active) {
            background: var(--cream);
            transform: translateY(-2px);
        }
        
        .tab-content {
            display: none;
            animation: fadeIn 0.4s;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 欢迎遮罩层 */
        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--mint-light), var(--sky-light), var(--lavender-light));
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .welcome-overlay.hidden {
            display: none;
        }
        
        .welcome-content {
            background: white;
            border-radius: 28px;
            padding: 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px var(--shadow);
            animation: slideUp 0.5s;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .welcome-icon {
            font-size: 3.5em;
            text-align: center;
            margin-bottom: 12px;
        }
        
        .welcome-title {
            font-size: 1.4em;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            margin-bottom: 20px;
        }
        
        .welcome-subtitle {
            color: var(--text-light);
            text-align: center;
            font-size: 0.9em;
            margin-bottom: 24px;
        }
        
        /* 角色网格 */
        .role-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .role-card {
            background: var(--cream);
            border-radius: 16px;
            padding: 20px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .role-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px var(--shadow);
        }
        
        .role-card.selected {
            border-color: var(--mint);
            background: linear-gradient(135deg, var(--mint-light), var(--sky-light));
        }
        
        .role-icon {
            font-size: 2.5em;
            margin-bottom: 8px;
        }
        
        .role-name {
            font-size: 0.95em;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }
        
        .role-desc {
            font-size: 0.75em;
            color: var(--text-light);
        }
        
        /* 按钮 */
        .btn {
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 14px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--mint), var(--sky));
            color: white;
            box-shadow: 0 6px 20px var(--shadow);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--shadow);
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        /* 进度条 */
        .progress-bar {
            background: var(--cream);
            border-radius: 10px;
            height: 8px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        
        .progress-fill {
            background: linear-gradient(90deg, var(--mint), var(--sky));
            height: 100%;
            border-radius: 10px;
            transition: width 0.4s;
        }
        
        .progress-text {
            font-size: 0.8em;
            color: var(--text-light);
            text-align: center;
            margin-bottom: 8px;
        }
        
        /* 问题卡片 */
        .question-card {
            background: linear-gradient(135deg, var(--cream), var(--sky-light));
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        
        .question-number {
            color: var(--mint);
            font-size: 0.85em;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .question-text {
            color: var(--text);
            font-size: 1.05em;
            margin-bottom: 16px;
            line-height: 1.6;
            font-weight: 500;
        }
        
        .option {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background: white;
            border: 2px solid var(--cream-dark);
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.25s;
        }
        
        .option:hover {
            border-color: var(--mint);
            background: var(--cream);
            transform: translateX(6px);
        }
        
        .option.selected {
            border-color: var(--mint);
            background: linear-gradient(135deg, var(--mint-light), var(--sky-light));
            transform: translateX(12px);
            box-shadow: 0 6px 20px var(--shadow);
        }
        
        .option-letter {
            width: 28px;
            height: 28px;
            background: var(--mint);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            margin-right: 12px;
            font-size: 0.85em;
            transition: all 0.25s;
        }
        
        .option.selected .option-letter {
            background: var(--sky);
            transform: scale(1.15);
        }
        
        .option-text {
            color: var(--text);
            font-size: 0.95em;
            line-height: 1.5;
        }
        
        /* 趋势统计 */
        .trend-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        
        .trend-stat {
            background: var(--cream);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        
        .trend-stat-value {
            font-size: 1.3em;
            font-weight: 700;
            color: var(--mint);
        }
        
        .trend-stat-label {
            font-size: 0.75em;
            color: var(--text-light);
        }
        
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: var(--cream);
            border-radius: 10px;
            margin-bottom: 8px;
        }
        
        .history-date {
            font-size: 0.85em;
            color: var(--text-light);
        }
        
        .history-score {
            font-weight: 600;
            color: var(--text);
        }
        
        .history-role {
            font-size: 0.7em;
            padding: 2px 8px;
            background: var(--lavender-light);
            color: var(--lavender);
            border-radius: 10px;
            margin-left: 8px;
        }
        
        /* 日历 */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        
        .calendar-month {
            font-weight: 600;
            color: var(--text);
            font-size: 0.9em;
        }
        
        .calendar-nav-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 8px;
            background: var(--cream);
            cursor: pointer;
            font-size: 0.9em;
            color: var(--text);
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        
        .calendar-day-header {
            text-align: center;
            font-size: 0.7em;
            color: var(--text-light);
            padding: 6px 0;
            font-weight: 500;
        }
        
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 0.8em;
            background: var(--cream);
            transition: all 0.2s;
        }
        
        .calendar-day:hover {
            background: var(--cream-dark);
            transform: scale(1.1);
        }
        
        .calendar-day-today {
            background: var(--mint);
            color: white;
            font-weight: 700;
            border: 2px solid var(--sky);
        }
        
        .calendar-day-1 { background: var(--mint-light); color: #2D6A4F; }
        .calendar-day-2 { background: var(--sky-light); color: #1E6091; }
        .calendar-day-3 { background: linear-gradient(135deg, var(--peach-light), var(--lavender-light)); color: #7C5295; }
        .calendar-day-4 { background: linear-gradient(135deg, var(--peach), var(--lavender)); color: #6B3E8C; }
        .calendar-day-5 { background: linear-gradient(135deg, var(--peach), #E8A5A5); color: #8B3A3A; }
        
        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
            font-size: 0.7em;
            color: var(--text-light);
        }
        
        .legend span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
        }
        
        /* 呼吸练习 */
        .breathing-container {
            text-align: center;
            padding: 20px;
        }
        
        .breathing-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--mint), var(--sky));
            margin: 0 auto 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 40px var(--shadow);
            cursor: pointer;
        }
        
        .breathing-circle.expand {
            transform: scale(1.3);
        }
        
        .breathing-text {
            font-size: 1.4em;
            font-weight: 700;
            color: white;
        }
        
        .breathing-sub {
            font-size: 0.85em;
            color: var(--cream);
            margin-top: 6px;
        }
        
        .breathing-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .breath-preset {
            padding: 10px 18px;
            border: 2px solid var(--cream-dark);
            border-radius: 25px;
            background: white;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
            color: var(--text);
        }
        
        .breath-preset.active {
            border-color: var(--mint);
            background: linear-gradient(135deg, var(--mint-light), var(--sky-light));
            color: var(--text);
            font-weight: 600;
        }
        
        .breath-guide {
            background: var(--cream);
            border-radius: 12px;
            padding: 14px;
            margin-top: 16px;
            font-size: 0.85em;
            color: var(--text);
            line-height: 1.7;
        }
        
        /* 解压气泡 */
        .bubble-container {
            background: var(--cream);
            border-radius: 14px;
            padding: 16px;
            min-height: 280px;
        }
        
        .bubble-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            font-size: 0.9em;
            color: var(--text);
            background: white;
            padding: 12px 16px;
            border-radius: 10px;
        }
        
        .bubble-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
        }
        
        .bubble {
            aspect-ratio: 1;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--mint), var(--sky));
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 4px 15px var(--shadow);
            position: relative;
            border: none;
        }
        
        .bubble::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 20%;
            width: 25%;
            height: 25%;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
        }
        
        .bubble:active {
            transform: scale(0.92);
        }
        
        .bubble.popped {
            animation: bubblePop 0.4s forwards;
            pointer-events: none;
        }
        
        @keyframes bubblePop {
            0% { transform: scale(1); }
            30% { transform: scale(1.2); }
            60% { transform: scale(0.8); }
            100% { transform: scale(0); opacity: 0; }
        }
        
        .bubble-hint {
            text-align: center;
            color: var(--text-light);
            font-size: 0.85em;
            margin-top: 14px;
        }
        
        /* 小贴士 */
        .tip-card {
            background: linear-gradient(135deg, var(--mint-light), var(--sky-light));
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .tip-label {
            font-size: 0.75em;
            color: #2D6A4F;
            font-weight: 600;
            margin-bottom: 6px;
        }
        
        .tip-text {
            color: #1E5332;
            font-size: 0.95em;
            line-height: 1.6;
        }
        
        .tip-refresh {
            font-size: 0.8em;
            color: #2D6A4F;
            margin-top: 10px;
            cursor: pointer;
            text-decoration: underline;
            background: none;
            border: none;
        }
        
        /* 目标设定 */
        .goals-section {
            background: var(--cream);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .goal-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: white;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        
        .goal-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--cream-dark);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .goal-checkbox.checked {
            background: var(--mint);
            border-color: var(--mint);
            color: white;
        }
        
        .goal-text {
            flex: 1;
            color: var(--text);
            font-size: 0.9em;
        }
        
        .goal-text.completed {
            text-decoration: line-through;
            color: var(--text-light);
        }
        
        .goal-delete {
            width: 24px;
            height: 24px;
            border: none;
            background: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 1.2em;
        }
        
        .goal-add {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        
        .goal-add input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid var(--cream-dark);
            border-radius: 10px;
            font-size: 0.9em;
            outline: none;
            color: var(--text);
        }
        
        .goal-add input:focus {
            border-color: var(--mint);
        }
        
        .goal-progress {
            background: var(--cream);
            border-radius: 8px;
            height: 8px;
            margin-top: 12px;
            overflow: hidden;
        }
        
        .goal-progress-fill {
            background: linear-gradient(90deg, var(--mint), var(--sky));
            height: 100%;
            transition: width 0.3s;
        }
        
        /* 资源推荐 */
        .resource-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        
        .resource-card {
            background: var(--cream);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        
        .resource-card:hover {
            border-color: var(--mint);
            transform: translateY(-2px);
        }
        
        .resource-icon {
            font-size: 1.8em;
            margin-bottom: 6px;
        }
        
        .resource-title {
            font-size: 0.85em;
            color: var(--text);
            font-weight: 500;
        }
        
        .hotline-card {
            background: linear-gradient(135deg, var(--peach-light), var(--lavender-light));
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        
        .hotline-title {
            color: #7C5295;
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .hotline-number {
            color: #6B3E8C;
            font-size: 1.3em;
            font-weight: 700;
        }
        
        /* 弹窗 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 24px;
            max-width: 420px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            animation: modalIn 0.3s;
        }
        
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        .modal-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .modal-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .modal-title {
            font-size: 1.3em;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }
        
        .modal-subtitle {
            color: var(--text-light);
            font-size: 0.9em;
        }
        
        /* 结果卡片 */
        .result-card {
            background: linear-gradient(135deg, var(--mint-light), var(--sky-light));
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .score-display {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 8px;
        }
        
        .score-number {
            font-size: 3.5em;
            font-weight: 800;
            color: #2D6A4F;
            line-height: 1;
        }
        
        .score-label {
            color: #2D6A4F;
            font-size: 1em;
            opacity: 0.8;
        }
        
        .result-level {
            background: white;
            border-radius: 14px;
            padding: 16px;
            margin: 16px 0;
        }
        
        .level-name {
            font-size: 1.15em;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }
        
        .level-desc {
            color: var(--text);
            font-size: 0.95em;
            line-height: 1.6;
        }
        
        .suggestion-section {
            margin-top: 20px;
        }
        
        .suggestion-title {
            font-size: 1em;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 12px;
        }
        
        .suggestion-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px;
            background: var(--cream);
            border-radius: 12px;
            margin-bottom: 10px;
            text-align: left;
            border-left: 3px solid var(--mint);
        }
        
        .suggestion-icon {
            width: 24px;
            height: 24px;
            background: var(--mint);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            flex-shrink: 0;
            color: white;
        }
        
        .suggestion-text {
            color: var(--text);
            font-size: 0.9em;
            line-height: 1.6;
        }
        
        .disclaimer {

    <script>
        // ==================== 数据定义 ====================
        
        // 6个角色定义
        const roles = [
            { id: 'workplace', name: '职场女性', icon: '💼', desc: '工作压力大' },

        // 基础问题（所有角色都要回答）
        const baseQuestions = [
            { q: '近期你的情绪状态是？', dim: '情绪', o: ['积极乐观，情绪稳定', '总体还不错，偶尔有些低落', '经常感到焦虑或情绪低落', '大部分时间感到沮丧或无助'] },

            ],

                { q: '你的收入稳定性如何？', dim: '收入', o: ['稳定且可观', '基本稳定', '不太稳定', '很不稳定'] },

            career: [
                { q: '创业给你带来的最大压力是？', dim: '创业压力', o: ['资金压力', '团队管理', '市场不确定性', '家庭平衡'] },
                { q: '你如何平衡工作和生活？', dim: '平衡', o: ['做得很好', '还行', '很差', '完全失衡'] }
            ]
        };

        // 角色特定建议
        const roleSuggestions = {
            workplace: ['学会在工作时专注，下班后彻底放松', '建立工作边界，学会说「不」', '利用午休时间短暂休息', '周末培养与工作无关的兴趣爱好'],
            homemaker: ['家务分工可以让家人一起参与', '每天给自己30分钟独处时间', '不必追求完美，适当降低标准', '寻求家人的理解和支持'],
            student: ['制定合理的学习计划，避免临时抱佛脚', '适当运动有助于缓解考试焦虑', '和同学互相支持，不要孤军奋战', '保证充足睡眠，不要熬夜'],
            freelancer: ['建立固定的作息时间表', '设立明确的工作时间和休息时间', '建立稳定的社会支持网络', '学会接受不确定性'],
            parent: ['育儿不必追求完美，足够好就好', '加入妈妈互助群体，分享经验', '孩子午睡时给自己放个假', '必要时寻求专业帮助'],
            career: ['学会授权，不必事事亲力亲为', '保持与家人的良好沟通', '适当运动保持身心健康', '定期复盘，调整策略']
        };

        // 小贴士列表
        const tips = [
            '对自己不要太苛刻，接受不完美是心理健康的标志。',
            '学会说「不」，保护自己的时间和精力。',
            '每天给自己一点独处的时间。',
            '适度运动可以帮助改善情绪。',
            '保持规律作息对心理健康很重要。',
            '与信任的人分享感受可以减轻压力。',
            '允许自己休息，这不是偷懒。',
            '小小的进步也值得庆祝。',
            '不要把所有问题都自己扛。',
            '接纳负面情绪，它们也是正常的一部分。'
        ];

        // 资源推荐数据
        const resources = {
            read: { title: '推荐阅读', list: ['《情绪急救》- 盖伊·温奇博士', '《当下的力量》- 埃克哈特·托利', '《伯恩斯新情绪疗法》- 戴维·伯恩斯'] },
            app: { title: '推荐APP', list: ['潮汐 - 白噪音和放松', '小睡眠 - 助眠声音故事', '心潮 - 心理健康自评'] },
            video: { title: '推荐视频', list: ['李松蔚心理学 - 知乎', '武志红心理 - 微信公众号', '壹心理 - 专业心理内容'] },
            help: { title: '专业帮助', list: ['简单心理 - 心理咨询预约', '壹心理 - 专业心理平台', '心理援助热线 - 400-161-9995'] }
        };

        // ==================== 全局状态 ====================
        
        let state = {
            role: null,
            q: 0,
            a: [],
            history: [],
            goals: [],
            tipIdx: 0,
            breathTimer: null,
            breathRunning: false,
            calDate: new Date()
        };

        // ==================== DOM 元素引用 ====================
        
        let el = {};

        // ==================== 初始化 ====================
        
        function init() {
            // 初始化DOM引用
            el.welcomeOverlay = document.getElementById('welcomeOverlay');
            el.roleGrid = document.getElementById('roleGrid');
            el.startBtn = document.getElementById('startBtn');
            el.switchRoleBtn = document.getElementById('switchRoleBtn');
            el.roleBadge = document.getElementById('roleBadge');
            el.questionsContainer = document.getElementById('questionsContainer');
            el.nextBtn = document.getElementById('nextBtn');
            el.resultModal = document.getElementById('resultModal');
            el.resultIcon = document.getElementById('resultIcon');
            el.resultTitle = document.getElementById('resultTitle');
            el.resultDate = document.getElementById('resultDate');
            el.modalBody = document.getElementById('modalBody');
            el.resourcesModal = document.getElementById('resourcesModal');
            el.resourcesTitle = document.getElementById('resourcesTitle');
            el.resourcesBody = document.getElementById('resourcesBody');
            el.closeResources = document.getElementById('closeResources');
            el.tipText = document.getElementById('tipText');
            el.refreshTip = document.getElementById('refreshTip');
            el.goalList = document.getElementById('goalList');
            el.goalProgress = document.getElementById('goalProgress');
            el.goalProgressFill = document.getElementById('goalProgressFill');
            el.goalInput = document.getElementById('goalInput');
            el.addGoal = document.getElementById('addGoal');
            el.avgScore = document.getElementById('avgScore');
            el.maxScore = document.getElementById('maxScore');
            el.totalCount = document.getElementById('totalCount');
            el.historyList = document.getElementById('historyList');
            el.calendarMonth = document.getElementById('calendarMonth');
            el.calendarGrid = document.getElementById('calendarGrid');
            el.prevMonth = document.getElementById('prevMonth');
            el.nextMonth = document.getElementById('nextMonth');
            el.breathingCircle = document.getElementById('breathingCircle');
            el.breathingText = document.getElementById('breathingText');
            el.breathingSub = document.getElementById('breathingSub');
            el.breathGuide = document.getElementById('breathGuide');
            el.bubbleGrid = document.getElementById('bubbleGrid');
            el.poppedCount = document.getElementById('poppedCount');

            // 加载本地存储的数据
            const savedRole = localStorage.getItem('mhRole');
            if (savedRole) state.role = savedRole;
            
            const savedHistory = localStorage.getItem('mhHistory');
            if (savedHistory) state.history = JSON.parse(savedHistory);
            
            const savedGoals = localStorage.getItem('mhGoals');
            if (savedGoals) state.goals = JSON.parse(savedGoals);

            // 渲染初始界面
            renderRoles();
            bindEvents();
            renderBubble();
            updateTrend();
            renderCalendar();
            renderGoals();

            console.log('应用初始化完成');
        }

        // ==================== 数据持久化 ====================
        
        function saveData() {
            localStorage.setItem('mhRole', state.role || '');
            localStorage.setItem('mhHistory', JSON.stringify(state.history));
            localStorage.setItem('mhGoals', JSON.stringify(state.goals));
        }

        // ==================== 角色选择 ====================
        
        function renderRoles() {
            console.log('渲染角色网格...');
            let html = '';
            
            for (let i = 0; i < roles.length; i++) {
                const r = roles[i];
                const isSelected = state.role === r.id;
                html += `
                    <div class="role-card ${isSelected ? 'selected' : ''}" data-role="${r.id}">
                        <div class="role-icon">${r.icon}</div>
                        <div class="role-name">${r.name}</div>
                        <div class="role-desc">${r.desc}</div>
                    </div>
                `;
            }
            
            el.roleGrid.innerHTML = html;
            console.log('角色网格渲染完成，共', roles.length, '个角色');
            
            // 如果已有选中的角色，启用开始按钮
            if (state.role) {
                el.startBtn.disabled = false;
                updateRoleBadge();
                // 如果已经选择过角色，自动隐藏欢迎层并渲染题目
                if (el.welcomeOverlay) {
                    el.welcomeOverlay.classList.add('hidden');
                    // 修复：确保渲染第一道题目
                    renderQuestions();
                }
            }
        }

        function getRoleById(id) {
            for (let i = 0; i < roles.length; i++) {
                if (roles[i].id === id) return roles[i];
            }
            return null;
        }

        function selectRole(roleId) {
            state.role = roleId;
            saveData();
            
            // 更新UI选中状态
            const cards = el.roleGrid.querySelectorAll('.role-card');
            for (let i = 0; i < cards.length; i++) {
                cards[i].classList.remove('selected');
            }
            
            const selected = el.roleGrid.querySelector(`[data-role="${roleId}"]`);
            if (selected) {
                selected.classList.add('selected');
            }
            
            // 启用开始按钮
            el.startBtn.disabled = false;
            updateRoleBadge();
            
            console.log('选择角色:', getRoleById(roleId)?.name);
        }

        function updateRoleBadge() {
            if (state.role) {
                const r = getRoleById(state.role);
                if (r) {
                    el.roleBadge.innerHTML = `<span class="history-role">${r.icon} ${r.name}</span>`;
                }
            }
        }

        function showRoleSelector() {
            // 重置答题状态
            state.q = 0;
            state.a = [];
            
            // 显示欢迎遮罩层
            el.welcomeOverlay.classList.remove('hidden');
            el.welcomeOverlay.style.display = 'flex';  // 确保显示
            
            // 重新渲染角色，保留当前选中状态
            renderRoles();
            
            // 确保开始按钮状态正确
            el.startBtn.disabled = !state.role;
            
            console.log('打开角色选择器');
        }

        function startAssessment() {
            if (!state.role) {
                alert('请先选择一个角色');
                return;
            }
            
            // 隐藏欢迎遮罩层
            el.welcomeOverlay.classList.add('hidden');
            el.welcomeOverlay.style.display = 'none';
            
            state.q = 0;
            state.a = [];
            
            // 确保在自评标签页
            showTab('assessment');
            
            // 渲染第一题
            renderQuestions();
            
            console.log('开始评估，角色:', state.role);
        }

        // ==================== 事件绑定 ====================
        
        function bindEvents() {
            // 角色网格点击事件（使用事件委托）
            el.roleGrid.addEventListener('click', function(e) {
                const card = e.target.closest('.role-card');
                if (card) {
                    selectRole(card.dataset.role);
                }
            });
            
            // 开始按钮
            el.startBtn.addEventListener('click', startAssessment);
            
            // 切换角色按钮
            el.switchRoleBtn.addEventListener('click', showRoleSelector);
            
            // 标签切换
            const tabs = document.querySelectorAll('.nav-tab');
            for (let i = 0; i < tabs.length; i++) {
                tabs[i].addEventListener('click', function() {
                    const tabName = this.dataset.tab;
                    showTab(tabName);
                });
            }
            
            // 下一题按钮
            el.nextBtn.addEventListener('click', handleNext);
            
            // 呼吸预设按钮
            const breathPresets = document.querySelectorAll('.breath-preset');
            for (let i = 0; i < breathPresets.length; i++) {
                breathPresets[i].addEventListener('click', function() {
                    const mode = this.dataset.mode.split(',').map(Number);
                    setBreathMode(mode[0], mode[1], mode[2]);
                    
                    for (let j = 0; j < breathPresets.length; j++) {
                        breathPresets[j].classList.remove('active');
                    }
                    this.classList.add('active');
                });
            }
            
            // 呼吸圆圈点击
            el.breathingCircle.addEventListener('click', toggleBreathing);
            
            // 日历导航
            el.prevMonth.addEventListener('click', function() {
                state.calDate.setMonth(state.calDate.getMonth() - 1);
                renderCalendar();
            });
            
            el.nextMonth.addEventListener('click', function() {
                state.calDate.setMonth(state.calDate.getMonth() + 1);
                renderCalendar();
            });
            
            // 刷新小贴士
            el.refreshTip.addEventListener('click', function() {
                state.tipIdx = (state.tipIdx + 1) % tips.length;
                el.tipText.textContent = tips[state.tipIdx];
            });
            
            // 目标相关
            el.addGoal.addEventListener('click', addGoal);
            el.goalInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') addGoal();
            });
            
            // 资源卡片
            const resourceCards = document.querySelectorAll('.resource-card');
            for (let i = 0; i < resourceCards.length; i++) {
                resourceCards[i].addEventListener('click', function() {
                    showResources(this.dataset.res);
                });
            }
            
            // 关闭资源弹窗
            el.closeResources.addEventListener('click', function() {
                el.resourcesModal.classList.remove('show');
            });
        }

        // ==================== 标签切换 ====================
        
        function showTab(tabName) {
            const contents = document.querySelectorAll('.tab-content');
            for (let i = 0; i < contents.length; i++) {
                contents[i].classList.remove('active');
            }
            document.getElementById(tabName + 'Tab').classList.add('active');
            
            const tabs = document.querySelectorAll('.nav-tab');
            for (let i = 0; i < tabs.length; i++) {
                tabs[i].classList.remove('active');
                if (tabs[i].dataset.tab === tabName) {
                    tabs[i].classList.add('active');
                }
            }
            
            if (tabName === 'trend') updateTrend();
            if (tabName === 'calendar') renderCalendar();
        }

        // ==================== 问题回答 ====================
        
        function getAllQuestions() {
            let qs = baseQuestions.slice();
            if (state.role && roleQuestions[state.role]) {
                qs = qs.concat(roleQuestions[state.role]);
            }
            return qs;
        }

        function renderQuestions() {
            const qs = getAllQuestions();
            const q = qs[state.q];
            if (!q) return;
            
            let html = '';
            html += `<div class="progress-text">${state.q + 1}/${qs.length}</div>`;
            html += `<div class="progress-bar"><div class="progress-fill" style="width:${((state.q + 1) / qs.length * 100)}%"></div></div>`;
            html += `<div class="question-card"><div class="question-number">${q.dim}</div><div class="question-text">${q.q}</div></div>`;
            
            for (let i = 0; i < q.o.length; i++) {
                html += `
                    <div class="option" data-idx="${i}">
                        <span class="option-letter">${String.fromCharCode(65 + i)}</span>
                        <span class="option-text">${q.o[i]}</span>
                    </div>
                `;
            }
            
            el.questionsContainer.innerHTML = html;
            el.nextBtn.style.display = 'none';
            
            // 绑定选项点击事件
            const options = el.questionsContainer.querySelectorAll('.option');
            for (let i = 0; i < options.length; i++) {
                options[i].addEventListener('click', function() {
                    selectOption(parseInt(this.dataset.idx), qs.length);
                });
            }
        }

        function selectOption(idx, total) {
            const options = el.questionsContainer.querySelectorAll('.option');
            for (let i = 0; i < options.length; i++) {
                options[i].classList.remove('selected');
            }
            options[idx].classList.add('selected');
            
            state.a[state.q] = 4 - idx;  // A=4分(最好), B=3分, C=2分, D=1分(最差)
            el.nextBtn.style.display = 'block';
            el.nextBtn.textContent = state.q < total - 1 ? '下一题' : '查看结果';
        }

        function handleNext() {
            const qs = getAllQuestions();
            if (state.q < qs.length - 1) {
                state.q++;
                renderQuestions();
            } else {
                showResult();
            }
        }

        // ==================== 结果显示 ====================
        
        function showResult() {
            let sum = 0;
            for (let i = 0; i < state.a.length; i++) {
                sum += state.a[i];
            }
            
            const qs = getAllQuestions();
            const maxScore = qs.length * 4;  // 每题最高4分
            const score = Math.round((sum / maxScore) * 100);  // 转换为百分制
            
            let level, icon, desc;
            if (score >= 85) {
                level = '状态良好';
                icon = '🌿';
                desc = '你的心理状态很不错！继续保持健康的生活方式。';
            } else if (score >= 70) {
                level = '状态不错';
                icon = '🌤️';
                desc = '你的整体状态还可以，注意调节压力。';
            } else if (score >= 55) {
                level = '需要关注';
                icon = '🌤️';
                desc = '有些方面需要多注意，适当调整生活节奏。';
            } else {
                level = '建议关注';
                icon = '🤝';
                desc = '建议寻求专业帮助，你不是一个人。';
            }
            
            const roleSugs = roleSuggestions[state.role] || [];
            const allSugs = roleSugs.concat(['保持规律作息和运动习惯', '定期进行心理健康自检', '与朋友保持联系和交流']).slice(0, 5);
            
            // 保存历史
            state.history.push({
                date: new Date().toISOString(),
                score: score,
                role: state.role,
                a: state.a.slice()
            });
            if (state.history.length > 30) state.history.shift();
            saveData();
            
            // 渲染结果弹窗
            el.resultIcon.textContent = icon;
            el.resultTitle.textContent = level;
            const r = getRoleById(state.role);
            el.resultDate.textContent = new Date().toLocaleDateString('zh-CN') + ' · ' + (r ? r.name : '');
            
            let html = '';
            html += `
                <div class="result-card">
                    <div class="score-display">
                        <span class="score-number">${score}</span>
                        <span class="score-label">分</span>
                    </div>
                    <div class="result-level">
                        <div class="level-name">${icon} ${level}</div>
                        <div class="level-desc">${desc}</div>
                    </div>
                </div>
            `;
            
            html += '<div class="suggestion-section"><div class="suggestion-title">💡 针对你的建议</div>';
            for (let i = 0; i < allSugs.length; i++) {
                html += `
                    <div class="suggestion-item">
                        <span class="suggestion-icon">→</span>
                        <span class="suggestion-text">${allSugs[i]}</span>
                    </div>
                `;
            }
            html += '</div>';
            
            html += '<div class="disclaimer">📝 本评估仅供参考，不能替代专业诊断。</div>';
            html += `
                <div class="share-buttons">
                    <button class="share-btn" id="closeModal">关闭</button>
                    <button class="share-btn primary" id="shareResult">分享</button>
                </div>
            `;
            
            el.modalBody.innerHTML = html;
            el.resultModal.classList.add('show');
            
            document.getElementById('closeModal').addEventListener('click', function() {
                el.resultModal.classList.remove('show');
            });
            
            document.getElementById('shareResult').addEventListener('click', shareResult);
            
            // 重置状态
            state.q = 0;
            state.a = [];
        }

        function shareResult() {
            const r = getRoleById(state.role);
            const text = '🌿 心理健康自评\n' + '角色：' + (r ? r.name : '') + '\n' + '日期：' + new Date().toLocaleDateString('zh-CN') + '\n';
            
            if (navigator.share) {
                navigator.share({ title: '心理健康自评', text: text });
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(function() {
                    alert('结果已复制到剪贴板');
                });
            }
        }

        // ==================== 趋势和历史 ====================
        
        function updateTrend() {
            const h = state.history;
            if (h.length === 0) {
                el.avgScore.textContent = '--';
                el.maxScore.textContent = '--';
                el.totalCount.textContent = '0';
                el.historyList.innerHTML = '';
                return;
            }
            
            const scores = [];
            for (let i = 0; i < h.length; i++) {
                scores.push(h[i].score);
            }
            
            let sum = 0;
            let max = scores[0];
            for (let i = 0; i < scores.length; i++) {
                sum += scores[i];
                if (scores[i] > max) max = scores[i];
            }
            
            el.avgScore.textContent = Math.round(sum / scores.length);
            el.maxScore.textContent = max;
            el.totalCount.textContent = scores.length;
            
            let html = '';
            for (let i = h.length - 1; i >= Math.max(0, h.length - 7); i--) {
                const d = h[i];
                const r = getRoleById(d.role);
                const date = new Date(d.date);
                html += `
                    <div class="history-item">
                        <span class="history-date">${date.toLocaleDateString('zh-CN')}</span>
                        <div>
                            <span class="history-score">${d.score}分</span>
                            ${r ? '<span class="history-role">' + r.icon + '</span>' : ''}
                        </div>
                    </div>
                `;
            }
            el.historyList.innerHTML = html;
        }

        // ==================== 日历 ====================
        
        function renderCalendar() {
            const y = state.calDate.getFullYear();
            const m = state.calDate.getMonth();
            
            el.calendarMonth.textContent = y + '年' + (m + 1) + '月';
            
            const first = new Date(y, m, 1).getDay();
            const days = new Date(y, m + 1, 0).getDate();
            
            const wk = ['日', '一', '二', '三', '四', '五', '六'];
            let html = '';
            
            for (let i = 0; i < wk.length; i++) {
                html += '<div class="calendar-day-header">' + wk[i] + '</div>';
            }
            
            for (let i = 0; i < first; i++) {
                html += '<div></div>';
            }
            
            const today = new Date();
            for (let i = 1; i <= days; i++) {
                let h = null;
                for (let j = 0; j < state.history.length; j++) {
                    const d = new Date(state.history[j].date);
                    if (d.getFullYear() === y && d.getMonth() === m && d.getDate() === i) {
                        h = state.history[j];
                        break;
                    }
                }
                
                const lvl = h ? (h.score >= 85 ? 1 : h.score >= 70 ? 2 : h.score >= 55 ? 3 : h.score >= 40 ? 4 : 5) : 0;
                let cls = lvl ? 'calendar-day-' + lvl : '';
                if (today.getFullYear() === y && today.getMonth() === m && today.getDate() === i) {
                    cls += ' calendar-day-today';
                }
                
                html += '<div class="calendar-day ' + cls + '">' + i + '</div>';
            }
            
            el.calendarGrid.innerHTML = html;
        }

        // ==================== 呼吸练习 ====================
        
        let breathConfig = { in: 4, hold: 7, out: 8 };
        
        function setBreathMode(inhale, hold, exhale) {
            breathConfig = { in: inhale, hold: hold, out: exhale };
            stopBreathing();
        }
        
        function stopBreathing() {
            state.breathRunning = false;
            clearTimeout(state.breathTimer);
            el.breathingText.textContent = '准备好了';
            el.breathingSub.textContent = '点击开始';
            el.breathingCircle.classList.remove('expand');
        }
        
        function toggleBreathing() {
            if (state.breathRunning) {
                stopBreathing();
                return;
            }
            state.breathRunning = true;
            runBreathCycle();
        }
        
        function runBreathCycle() {
            if (!state.breathRunning) return;
            
            el.breathingText.textContent = '吸气';
            el.breathingSub.textContent = breathConfig.in + '秒';
            el.breathingCircle.classList.add('expand');
            
            state.breathTimer = setTimeout(function() {
                if (!state.breathRunning) return;
                
                el.breathingText.textContent = '屏息';
                el.breathingSub.textContent = breathConfig.hold + '秒';
                
                state.breathTimer = setTimeout(function() {
                    if (!state.breathRunning) return;
                    
                    el.breathingText.textContent = '呼气';
                    el.breathingSub.textContent = breathConfig.out + '秒';
                    el.breathingCircle.classList.remove('expand');
                    
                    state.breathTimer = setTimeout(runBreathCycle, breathConfig.out * 1000);
                }, breathConfig.hold * 1000);
            }, breathConfig.in * 1000);
        }

        // ==================== 解压气泡 ====================
        
        function renderBubble() {
            const colors = ['#7DD3C0', '#A8E6CF', '#B8A9C9', '#D4C5E8', '#FFB5A7', '#FFD3C9'];
            el.bubbleGrid.innerHTML = '';
            
            for (let i = 0; i < 18; i++) {
                const b = document.createElement('button');
                b.className = 'bubble';
                b.style.background = 'linear-gradient(135deg,' + colors[i % colors.length] + ',' + colors[(i + 1) % colors.length] + ')';
                b.addEventListener('click', function() {
                    if (this.classList.contains('popped')) return;
                    this.classList.add('popped');
                    const popped = document.querySelectorAll('.bubble.popped').length;
                    el.poppedCount.textContent = popped;
                });
                el.bubbleGrid.appendChild(b);
            }
            
            el.poppedCount.textContent = '0';
        }

        // ==================== 目标设定 ====================
        
        function renderGoals() {
            let html = '';
            let completed = 0;
            
            for (let i = 0; i < state.goals.length; i++) {
                const g = state.goals[i];
                if (g.done) completed++;
                html += `
                    <div class="goal-item">
                        <span class="goal-checkbox ${g.done ? 'checked' : ''}" data-idx="${i}">${g.done ? '✓' : ''}</span>
                        <span class="goal-text ${g.done ? 'completed' : ''}">${g.text}</span>
                        <button class="goal-delete" data-idx="${i}">×</button>
                    </div>
                `;
            }
            
            el.goalList.innerHTML = html;
            
            const total = state.goals.length;
            el.goalProgress.textContent = '(' + completed + '/' + total + ')';
            el.goalProgressFill.style.width = total ? (completed / total * 100) + '%' : '0%';
            
            // 绑定事件
            const checkboxes = el.goalList.querySelectorAll('.goal-checkbox');
            for (let i = 0; i < checkboxes.length; i++) {
                checkboxes[i].addEventListener('click', toggleGoal);
            }
            
            const deletes = el.goalList.querySelectorAll('.goal-delete');
            for (let i = 0; i < deletes.length; i++) {
                deletes[i].addEventListener('click', deleteGoal);
            }
            
            saveData();
        }
        
        function toggleGoal() {
            const idx = parseInt(this.dataset.idx);
            state.goals[idx].done = !state.goals[idx].done;
            renderGoals();
        }
        
        function deleteGoal() {
            const idx = parseInt(this.dataset.idx);
            state.goals.splice(idx, 1);
            renderGoals();
        }
        
        function addGoal() {
            const text = el.goalInput.value.trim();
            if (!text || state.goals.length >= 10) return;
            
            state.goals.push({ text: text, done: false });
            el.goalInput.value = '';
            renderGoals();
        }

        // ==================== 资源推荐 ====================
        
        function showResources(resKey) {
            const res = resources[resKey];
            if (!res) return;
            
            el.resourcesTitle.textContent = res.title;
            
            let html = '<ul style="list-style:none;padding:0">';
            for (let i = 0; i < res.list.length; i++) {
                html += '<li style="padding:8px 0;border-bottom:1px solid var(--cream-dark)">' + res.list[i] + '</li>';
            }
            html += '</ul>';
            
            el.resourcesBody.innerHTML = html;
            el.resourcesModal.classList.add('show');
        }

        // ==================== 启动应用 ====================
        
        // 暴露关键函数到全局
        window.startAssessment = startAssessment;
        window.showRoleSelector = showRoleSelector;
        
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
